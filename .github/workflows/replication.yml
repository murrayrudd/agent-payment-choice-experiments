name: Offline replication

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_refits:
        description: Recompute all 6000 monetary bootstrap fits
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify distribution
        run: python scripts/verify_package.py
      - name: Recompute main analysis and development summaries
        if: ${{ !inputs.full_refits }}
        run: python scripts/reproduce.py --mode quick --development
      - name: Recompute all analyses including monetary refits
        if: ${{ inputs.full_refits }}
        run: python scripts/reproduce.py --mode full --development
